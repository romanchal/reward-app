services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reward_app
      POSTGRES_USER: reward_app
      POSTGRES_PASSWORD: reward_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward_app -d reward_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://reward_app:reward_app@postgres:5432/reward_app
      JWT_SECRET: local-development-secret-change-me
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-me
      FRONTEND_ORIGIN: http://localhost:5173
      ADMIN_ORIGIN: http://localhost:5174
      PAYMENT_MODE: demo
      OFFER_MODE: demo
      EMAIL_MODE: console
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
